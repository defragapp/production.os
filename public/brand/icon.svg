<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sovereign OS — favicon-scale rendition of the Ace-of-Cups emblem.
  The full engraving lives in assets/ace-of-cups.jpg and rasterises through
  scripts/build-brand-assets.mjs to public/brand/emblem-core-bold.png; that
  artwork is what the nav header, iOS home-screen tile, and social card use.
  At 16–32 px those hairlines fuse into a smudge, so the browser tab gets a
  hand-drawn silhouette that keeps the same composition — descending dove
  above the overflowing chalice — reduced to two shapes a small raster can
  still read. The plate background is `#0d0d0d` (theme-color) so the icon
  never shows a white halo on dark-mode tabs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sovereign OS">
  <rect width="32" height="32" rx="6" fill="#0d0d0d"/>
  <!-- Dove: descending, wings swept up, beak toward the cup. -->
  <path
    d="M16 6.2 C 13.4 6.2 11.4 8.1 11.4 10.2 C 11.4 11.9 12.7 13.3 14.4 13.7 L 14.0 12.2 C 12.9 11.7 12.2 10.7 12.2 9.6 C 12.2 8.4 13.5 7.5 14.9 7.9 L 16.0 8.4 L 17.1 7.9 C 18.5 7.5 19.8 8.4 19.8 9.6 C 19.8 10.7 19.1 11.7 18.0 12.2 L 17.6 13.7 C 19.3 13.3 20.6 11.9 20.6 10.2 C 20.6 8.1 18.6 6.2 16.0 6.2 Z"
    fill="#f4efe4"
  />
  <!-- Chalice: cup, stem, base. Slight flare at the rim reads as "overflowing". -->
  <path
    d="M9.4 16.0 L 22.6 16.0 C 22.4 19.4 20.0 21.4 17.4 21.6 L 17.4 24.6 L 20.2 24.6 L 20.2 25.8 L 11.8 25.8 L 11.8 24.6 L 14.6 24.6 L 14.6 21.6 C 12.0 21.4 9.6 19.4 9.4 16.0 Z"
    fill="#f4efe4"
  />
</svg>
